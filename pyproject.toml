[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adcs-tex-cpp-extractor"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent Aspose.TeX C++ extraction worker"
dependencies = []

[project.scripts]
adcs-tex-cpp-extract = "adcs_tex_cpp.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
